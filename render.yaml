services:
  - type: web
    name: orbi-api
    runtime: node
    plan: free
    region: ohio
    buildCommand: cd apps/api && npm ci && npx prisma generate && npm run build
    startCommand: cd apps/api && npx prisma migrate deploy && node dist/index.js
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: orbi-postgres
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: SEED_ADMIN_EMAIL
        value: admin@example.invalid
      - key: SEED_ADMIN_PASSWORD
        generateValue: true
      - key: CORS_ORIGIN
        sync: false

databases:
  - name: orbi-postgres
    plan: free
    region: ohio
    databaseName: orbi
    user: orbi
