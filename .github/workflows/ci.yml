name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [web, api]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build frontend
        if: matrix.app == 'web'
        run: |
          corepack enable
          cd apps/web
          pnpm install --frozen-lockfile
          pnpm build
      - name: Build API
        if: matrix.app == 'api'
        run: |
          cd apps/api
          npm ci
          npx prisma generate
          npm run build
